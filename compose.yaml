services:
  control-db:
    image: 'postgres:18.6'
    environment:
      - 'POSTGRES_DB=lifecycle_control'
      - 'POSTGRES_PASSWORD=${CONTROL_DB_PASSWORD:-lifecycle}'
      - 'POSTGRES_USER=lifecycle'
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      - control-data:/var/lib/postgresql
volumes:
  control-data:
