spring.application.name=DataLifePolicyEnforcer
server.port=8091
spring.datasource.url=${CONTROL_DB_URL:jdbc:postgresql://localhost:5432/lifecycle_control}
spring.datasource.username=${CONTROL_DB_USERNAME:lifecycle}
spring.datasource.password=${CONTROL_DB_PASSWORD:lifecycle}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.docker.compose.enabled=false
spring.security.user.name=${APP_USERNAME:admin}
spring.security.user.password=${APP_PASSWORD:admin}
server.error.include-message=never
server.error.include-binding-errors=never
spring.jackson.deserialization.fail-on-unknown-properties=true
lifecycle.scheduler.enabled=${SCHEDULER_ENABLED:false}
